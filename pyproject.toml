[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rentas_cdmx"
version = "0.0.1"
description = "Estimaci\u00f3n de renta mensual de departamentos en CDMX con MLOps (TC5061)"
authors = [
  { name = "Oscar Elton" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["rentas_cdmx"]
include = ["pyproject.toml", "rentas_cdmx/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["rentas_cdmx"]
force-sort-within-sections = true

